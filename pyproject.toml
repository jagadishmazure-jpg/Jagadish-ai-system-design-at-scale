[project]
name = "ai-system-design-at-scale"
version = "0.1.0"
description = "Production AI system design patterns around a fictional e-commerce support agent, measured off vs on"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
