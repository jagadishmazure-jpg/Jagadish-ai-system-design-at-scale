apiVersion: apps/v1
kind: Deployment
metadata:
  name: kestrel-api
  labels: {app: kestrel-api}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  selector:
    matchLabels: {app: kestrel-api}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below full capacity
      maxSurge: 1         # add one new pod at a time
  template:
    metadata:
      labels: {app: kestrel-api}
    spec:
      securityContext: {runAsNonRoot: true}
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: kestrel-api:v1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          envFrom: [{configMapRef: {name: kestrel-api-config}}]
          env:
            - {name: APP_VERSION, value: v1}
            - {name: APP_BROKEN_CONFIG, value: "0"}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: {command: ["python", "-c", "import time; time.sleep(5)"]}  # let endpoints drain
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
