# Offline CI: lint, tests, load-model + docs drift checks, brand check, real-backend integration,
# docker compose smoke, secret scan, IaC validate (no apply), kind rollout. No cloud resources, no provider keys.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (in-process, fakeredis + SQLite)
        run: python -m pytest -q
      - name: Test count is printed by a real collection
        run: python scripts/count_tests.py
      - name: Committed load-model results match a fresh run
        run: python -m loadtest.harness --check
      - name: README and capacity numbers match the results and test count
        run: python scripts/render_docs.py --check
      - name: Talk 15 caching results and evidence board match a fresh run
        run: python scripts/caching_bench.py --check && python scripts/evidence_board.py --check && python scripts/tail_latency_bench.py --check && python scripts/tail_evidence_board.py --check
      - name: Talk 17 results and evidence board match a fresh run
        run: python scripts/talk17_bench.py --check && python scripts/stream_evidence_board.py --check
      - name: No real brand names in code or docs
        run: python scripts/check_brands.py

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: sd, POSTGRES_PASSWORD: sd-ci-only, POSTGRES_DB: sd }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sd" --health-interval 5s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_DSN: postgresql://sd:sd-ci-only@localhost:5432/sd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -r requirements-dev.txt "psycopg[binary]==3.2.9"
      - name: Lua scripts and checkpoints against real Redis and Postgres
        run: python -m pytest -q -rs tests/test_integration_real_backends.py tests/test_talks_real_redis.py

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -r requirements.txt
      - name: docker compose up, requests through nginx, down
        run: bash scripts/compose_smoke.sh

  iac-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install terraform (checksum-pinned; no credentials, no apply)
        run: |
          curl -fsSLo tf.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          echo "186e0145f5e5f2eb97cbd785bc78f21bae4ef15119349f6ad4fa535b83b10df8  tf.zip" | sha256sum -c
          unzip -q -o tf.zip terraform -d "$RUNNER_TEMP" && sudo mv "$RUNNER_TEMP/terraform" /usr/local/bin/
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false && terraform -chdir=terraform validate
      - name: Bicep build (parity check, no deploy)
        run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null

  image-and-kind-rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create kind cluster (checksum-pinned binary)
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.24.0/kind-linux-amd64
          echo "b89aada5a39d620da3fcd16435b7f28d858927dd53f92cbac77686b0588b600d  kind" | sha256sum -c
          chmod +x kind && sudo mv kind /usr/local/bin/ && kind create cluster --wait 120s
      - name: Image tagged with the git SHA; v1 -> v2 under load, broken v3 must halt
        env: { OUT: loadtest/results/k8s_rollout.json }
        run: GIT_SHA=${GITHUB_SHA::12} bash scripts/kind_rollout.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: k8s-rollout, path: loadtest/results/k8s_rollout.json, if-no-files-found: warn }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
