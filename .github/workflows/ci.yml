name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}

jobs:
  test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: pytest
        env: {REDIS_URL: "redis://localhost:6379/0"}
        run: python -m pytest -q
      - name: test count
        run: python scripts/count_tests.py
      - name: documented output matches a fresh run
        run: python scripts/render_docs.py --check
      - name: brand check
        run: python scripts/check_brands.py
      - name: eval gate and drift
        run: python -m sysdesign.evals
      - name: load test (ci scale, simulated)
        run: python -m loadtest.harness --scale ci
      - name: capacity estimate at 1x and 10x
        run: python -m scripts.estimate && python -m scripts.estimate --scale 10

  terraform:
    name: iac-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: install terraform (no credentials, no apply)
        run: |
          curl -fsSLo tf.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          echo "186e0145f5e5f2eb97cbd785bc78f21bae4ef15119349f6ad4fa535b83b10df8  tf.zip" | sha256sum -c
          unzip -q tf.zip && sudo mv terraform /usr/local/bin/
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false && terraform -chdir=terraform validate
      - name: bicep build (parity, no deploy)
        run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null

  image-and-kind:
    name: image-and-kind-rollout
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: build image tagged with the git SHA
        run: docker build --build-arg GIT_SHA=${GITHUB_SHA::12} -t quillmoor-api:${GITHUB_SHA::12} .
      - name: create kind cluster
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.24.0/kind-linux-amd64
          echo "b89aada5a39d620da3fcd16435b7f28d858927dd53f92cbac77686b0588b600d  kind" | sha256sum -c
          chmod +x kind && sudo mv kind /usr/local/bin/ && kind create cluster --wait 120s
      - name: v1 -> v2 rollout under load, broken v3 must halt
        env: {OUT: results/k8s_rollout.json}
        run: GIT_SHA=${GITHUB_SHA::12} bash scripts/kind_rollout.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: k8s-rollout, path: results/k8s_rollout.json, if-no-files-found: warn}
