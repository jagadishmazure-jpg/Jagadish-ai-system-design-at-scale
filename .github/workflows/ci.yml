# Offline CI: lint, tests, load-model + docs drift checks, brand check, real-backend integration,
# docker compose smoke, secret scan. No cloud resources, no provider keys.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (in-process, fakeredis + SQLite)
        run: python -m pytest -q
      - name: Test count is printed by a real collection
        run: python scripts/count_tests.py
      - name: Committed load-model results match a fresh run
        run: python -m loadtest.harness --check
      - name: README and capacity numbers match the results and test count
        run: python scripts/render_docs.py --check
      - name: No real brand names in code or docs
        run: python scripts/check_brands.py

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: sd, POSTGRES_PASSWORD: sd-ci-only, POSTGRES_DB: sd }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sd" --health-interval 5s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_DSN: postgresql://sd:sd-ci-only@localhost:5432/sd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -r requirements-dev.txt "psycopg[binary]==3.2.9"
      - name: Lua scripts and checkpoints against real Redis and Postgres
        run: python -m pytest -q -rs tests/test_integration_real_backends.py

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -r requirements.txt
      - name: docker compose up, requests through nginx, down
        run: bash scripts/compose_smoke.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
