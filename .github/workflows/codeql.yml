name: CodeQL
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "17 5 * * 1"}]
permissions: {contents: read}
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions: {security-events: write, contents: read, actions: read}
    strategy:
      matrix: {language: [python, actions]}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with: {languages: "${{ matrix.language }}"}
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52
