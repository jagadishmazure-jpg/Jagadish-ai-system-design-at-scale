# STATUS: PLANNED - not installed anywhere. Shows how Argo CD would sync k8s/ from main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quillmoor-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jagadishmazure-jpg/Jagadish-ai-system-design-at-scale
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: quillmoor
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
