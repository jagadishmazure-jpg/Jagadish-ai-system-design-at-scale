events { worker_connections 1024; }
http {
  upstream api {
    least_conn;
    server api-1:8000 max_fails=2 fail_timeout=5s;
    server api-2:8000 max_fails=2 fail_timeout=5s;
    server api-3:8000 max_fails=2 fail_timeout=5s;
    keepalive 32;                        # pooled upstream connections
  }
  map $http_x_request_id $rid { default $http_x_request_id; "" $request_id; }
  gzip on; gzip_types application/json text/plain; gzip_min_length 1024;
  # brotli needs the ngx_brotli module (not in the stock image): planned, see docs/LATENCY.md
  client_max_body_size 16k;              # 413 at the edge, repeated in-process
  keepalive_timeout 30s;
  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:TLS:10m;    # session resumption makes warm handshakes cheaper
    location /v1/chat/stream { proxy_pass http://api; proxy_buffering off; proxy_http_version 1.1;
      proxy_set_header Connection ""; proxy_set_header X-Request-Id $rid; proxy_read_timeout 120s; }
    location /v1/orders/ { proxy_pass http://api; proxy_buffering off; proxy_http_version 1.1;
      proxy_set_header Connection ""; proxy_set_header X-Request-Id $rid; proxy_read_timeout 300s; }
    location /admin/ { return 404; }     # admin is never exposed at the edge
    location / { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_set_header X-Request-Id $rid; proxy_connect_timeout 2s; proxy_read_timeout 30s; }
  }
}
