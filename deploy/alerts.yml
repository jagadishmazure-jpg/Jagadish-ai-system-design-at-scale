groups:
  - name: slo
    rules:
      - alert: P95LatencyAbove3s
        expr: histogram_quantile(0.95, sum(rate(sd_request_latency_seconds_bucket[5m])) by (le)) > 3
        for: 5m
      - alert: LlmSpendPerHourHigh
        expr: sum(increase(sd_llm_cost_usd_total[1h])) > 5
      - alert: TokenBurnHigh
        expr: sum(increase(sd_llm_tokens_total[1h])) > 2000000
      - alert: AdmissionRejectionsSpike
        expr: sum(rate(sd_admission_rejections_total[5m])) / sum(rate(sd_requests_total[5m])) > 0.2
        for: 10m
