# Edge API gateway: one entrance, body-size cap, edge rate limit, request ids, health-aware load balancing.
# Per-user limits and token budgets are enforced in the app against Redis (nginx cannot see JWT claims here).
events {}
http {
  limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
  upstream core_ai {
    least_conn;
    server api1:8000 max_fails=2 fail_timeout=5s;
    server api2:8000 max_fails=2 fail_timeout=5s;
    server api3:8000 max_fails=2 fail_timeout=5s;
  }
  server {
    listen 8080;
    client_max_body_size 16k;
    proxy_connect_timeout 1s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    location /v1/ {
      limit_req zone=perip burst=40 nodelay;
      limit_req_status 429;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Authorization $http_authorization;
      proxy_buffering off;  # let SSE tokens through as they are produced
      proxy_pass http://core_ai;
    }
    location = /healthz { proxy_pass http://core_ai; }
    location = /readyz { proxy_pass http://core_ai; }
    location / { return 404; }
  }
}
